<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Is Your Handstand a Banana Handstand?</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-image: url("{{ url_for('static', filename='banana_background.jpg') }}");
            background-repeat: repeat;
            background-size: 256px 256px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .container {
            background-color: #ffffff;
            padding: 36px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(18,23,35,0.08);
            border: 1px solid rgba(99,102,241,0.08);
        }
        h1 {
            color: #1f2330;
            text-align: center;
            margin-bottom: 24px;
            font-weight: 800;
        }
        .example { margin: 0 auto 22px; max-width: 320px; text-align: center; }
        .example img { width: 100%; display: block; border-radius: 10px; box-shadow: 0 4px 14px rgba(18,23,35,0.10); }
        .example figcaption { font-size: 12.5px; color: #6b7280; margin-top: 6px; }
        .upload-container {
            margin: 20px 0;
        }
        .upload-area {
            background-color: #ffffff;
            border: 2px dashed rgba(124,77,255,0.35);
            border-radius: 16px;
            padding: 56px 36px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 18px rgba(18,23,35,0.06);
            position: relative;
        }
        .image-preview {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 16px;
        }
        .image-preview img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(18,23,35,0.12);
        }
        .upload-area:hover {
            border-color: rgba(124,77,255,0.55);
            box-shadow: 0 10px 24px rgba(18,23,35,0.08);
            transform: translateY(-1px);
        }
        .upload-area.dragover {
            border-color: #6a3fff;
            background-color: #faf8ff;
            box-shadow: 0 0 0 8px rgba(124,77,255,0.18), 0 12px 28px rgba(18,23,35,0.10);
        }
        .upload-icon {
            width: 60px;
            height: 60px;
            background-color: #f5f5f8;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: #666;
            box-shadow: inset 0 -2px 8px rgba(0,0,0,0.04);
        }
        .upload-text {
            margin-top: 20px;
        }
        .upload-primary {
            font-size: 18px;
            font-weight: 700;
            color: #1f2330;
            margin: 0 0 8px 0;
        }
        .upload-secondary {
            font-size: 14px;
            color: #6b7280;
            margin: 0;
        }
        .file-info {
            margin-top: 15px;
            padding: 12px;
            background: linear-gradient(180deg, #fafbff, #f5f7ff);
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(99,102,241,0.10);
        }
        .file-info p {
            margin: 0;
            color: #495057;
        }
        input[type="file"] {
            display: none;
        }
        button {            background: linear-gradient(135deg, #7c4dff, #5a34e6);
            color: white;
            padding: 14px 24px;
            border: none;
            border-radius: 28px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            box-shadow: 0 10px 20px rgba(124,77,255,0.25), 0 2px 6px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #6a3fff, #4b2fd1);
            transform: translateY(-1px);
            box-shadow: 0 14px 26px rgba(124,77,255,0.32), 0 4px 10px rgba(0,0,0,0.06);
        }
        button::before {
            content: "↗";
            font-size: 18px;
        }
        .result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
        }
        .good-form {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        .bad-form {
            background-color: #fffef7;
            border: 2px solid #ffd700;
            color: #2c3e50;
        }
        .error {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            color: #856404;
        }
        .back-btn {
            background-color: #6c757d;
            margin-top: 20px;
        }
        .back-btn:hover {
            background-color: #545b62;
        }
        .feedback-section {
            margin-top: 28px;
            padding: 18px 20px;
            background: linear-gradient(180deg, #fffef7, #fff8e1);
            border: 2px solid #ffd700;
            border-radius: 12px;
        }
        .feedback-section h2 {
            margin: 0 0 8px 0;
            color: #1f2330;
            font-weight: 800;
            font-size: 17px;
        }
        .feedback-blurb {
            margin: 0 0 12px 0;
            color: #4b5563;
            line-height: 1.5;
            font-size: 14px;
        }
        .feedback-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .fb-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            align-items: center;
        }
        .fb-row button {
            width: auto;
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 14px;
            box-shadow: none;
        }
        .fb-row button::before {
            content: none;
        }
        .feedback-form textarea,
        .feedback-form input[type="email"] {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            font-family: inherit;
            font-size: 15px;
            color: #1f2330;
            background-color: #ffffff;
            border: 1px solid rgba(99,102,241,0.20);
            border-radius: 10px;
            box-shadow: inset 0 1px 2px rgba(18,23,35,0.04);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .feedback-form textarea {
            resize: vertical;
            min-height: 64px;
            font-size: 14px;
        }
        .feedback-form textarea:focus,
        .feedback-form input[type="email"]:focus {
            outline: none;
            border-color: rgba(124,77,255,0.55);
            box-shadow: 0 0 0 4px rgba(124,77,255,0.15);
        }
        .feedback-thanks {
            margin-bottom: 20px;
            padding: 14px 18px;
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
        }
        .privacy-note {
            text-align: center;
            font-size: 13px;
            color: #6b7280;
            margin: 10px 0 0;
        }
        .share-section {
            margin: 30px 0;
            padding: 20px;
            background: linear-gradient(180deg, #fffef7, #fff8e1);
            border: 2px solid #ffd700;
            border-radius: 12px;
            text-align: center;
        }
        .share-title {
            font-weight: 800;
            font-size: 18px;
            color: #1f2330;
            margin: 0 0 14px;
        }
        .share-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .share-buttons button {
            flex: 1 1 200px;
            width: auto;
        }
        .site-footer {
            margin: 24px auto 8px;
            padding: 14px 20px;
            text-align: center;
            background-color: rgba(255,255,255,0.92);
            border-radius: 12px;
            font-size: 14px;
            color: #6b7280;
            box-shadow: 0 4px 14px rgba(18,23,35,0.06);
        }
        .site-footer p {
            margin: 0 0 4px;
        }
        .site-footer a {
            color: #5a34e6;
            text-decoration: none;
            font-weight: 600;
        }
        .site-footer a:hover {
            text-decoration: underline;
        }
        .top-nav {
            display: flex;
            justify-content: flex-end;
            margin: -8px 0 4px;
            font-size: 14px;
        }
        .top-nav a {
            background: #5a34e6;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 14px;
            border-radius: 8px;
        }
        .top-nav a:hover {
            background: #4a2ac2;
        }
        .samples { text-align: center; margin: 22px 0 8px; }
        .samples-title { font-weight: 600; color: #1f2330; margin: 0 0 12px; }
        .samples-row { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
        .sample { display: block; width: 150px; text-decoration: none; color: #1f2330; font-size: 13.5px; font-weight: 600; }
        .sample img { width: 150px; height: 150px; object-fit: cover; border-radius: 12px; border: 2px solid #ececf2; display: block; margin: 0 auto 6px; box-shadow: 0 4px 14px rgba(18,23,35,0.08); transition: transform .2s ease, border-color .2s ease; }
        .sample:hover img { border-color: #6a3fff; transform: translateY(-2px); }
        .sample-note { font-size: 13.5px; color: #4b5563; max-width: 560px; margin: 12px auto 0; line-height: 1.5; }
        .sample-note a { color: #5a34e6; font-weight: 600; }
        .photo-credit { font-size: 12px; color: #6b7280; margin: 6px 0 0; }
        .photo-credit a { color: #6b7280; }
        .case-card { display: grid; grid-template-columns: 150px 1fr; gap: 18px; align-items: center; margin: 26px 0 0; padding: 16px 18px; background: #f4f1ff; border: 1px solid #e0d9ff; border-radius: 12px; text-align: left; }
        .case-thumb img { width: 150px; border-radius: 8px; display: block; border: 1px solid #e0d9ff; }
        .tagline { text-align: center; color: #4b5563; font-size: 17px; max-width: 520px; margin: -6px auto 22px; line-height: 1.45; }
        .explainer { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: center; margin: 0 0 26px; padding: 16px 18px; background: #f6f7fb; border-radius: 12px; }
        .explainer .example { margin: 0; max-width: none; }
        .steps-v { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
        .steps-v li { display: flex; gap: 12px; align-items: flex-start; }
        .steps-v span { font-size: 24px; line-height: 1; width: 32px; text-align: center; flex: none; }
        .steps-v b { display: block; color: #1f2330; font-size: 14.5px; }
        .steps-v small { display: block; color: #6b7280; font-size: 13px; line-height: 1.35; }
        @media (max-width: 600px) { .explainer { grid-template-columns: 1fr; } }
        .case-card h3 { margin: 0 0 6px; font-size: 17px; color: #1f2330; }
        .case-card p { margin: 0 0 12px; font-size: 14px; color: #4b5563; line-height: 1.5; }
        .case-btn { display: inline-block; background: #5a34e6; color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 9px 16px; border-radius: 8px; }
        .case-btn:hover { background: #4a2ac2; }
        @media (max-width: 520px) { .case-card { grid-template-columns: 1fr; } .case-thumb img { width: 100%; } }
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav"><a href="{{ url_for('how_its_built') }}">How I built this →</a></nav>
        {% block content %}{% endblock %}
    </div>

    <footer class="site-footer">
        <p>Built by <a href="https://www.whirleyworld.com" target="_blank" rel="noopener">Shirley He</a></p>
        <nav>
            <a href="https://www.linkedin.com/in/shhirl" target="_blank" rel="noopener">LinkedIn</a> ·
            <a href="https://www.instagram.com/shirleywhirlhe" target="_blank" rel="noopener">Instagram</a> ·
            <a href="https://github.com/shhirl" target="_blank" rel="noopener">GitHub</a> ·
            <a href="{{ url_for('how_its_built') }}">How I built this</a>
        </nav>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('fileInput');
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const imagePreview = document.getElementById('imagePreview');
            const previewImg = document.getElementById('previewImg');
            const uploadForm = document.getElementById('uploadForm');

            // Home starts with default tiled background.
            
            if (uploadArea && fileInput) {
                // Click to upload
                uploadArea.addEventListener('click', function() {
                    fileInput.click();
                });
                
                // File selection handler
                fileInput.addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        fileName.textContent = file.name;
                        fileInfo.style.display = 'block';
                        analyzeBtn.style.display = 'block';

                        const uploadPrimary = uploadArea.querySelector('.upload-primary');
                        const uploadSecondary = uploadArea.querySelector('.upload-secondary');
                        uploadPrimary.textContent = 'File selected: ' + file.name;
                        uploadSecondary.textContent = 'Click to choose a different file';

                        if (file.type.startsWith('image/')) {
                            const reader = new FileReader();
                            reader.onload = function(evt) {
                                const dataUrl = evt.target.result;
                                previewImg.src = dataUrl;
                                imagePreview.style.display = 'flex';
                                // Tile the uploaded image as the page background
                                document.body.style.backgroundImage = `url(${dataUrl})`;
                                document.body.style.backgroundRepeat = 'repeat';
                                document.body.style.backgroundSize = '256px 256px';
                                try { localStorage.setItem('bgDataUrl', dataUrl); } catch (e) {}
                            };
                            reader.readAsDataURL(file);
                        }
                    }
                });
                
                // Drag and drop functionality
                uploadArea.addEventListener('dragover', function(e) {
                    e.preventDefault();
                    uploadArea.classList.add('dragover');
                });
                
                uploadArea.addEventListener('dragleave', function(e) {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                });
                
                uploadArea.addEventListener('drop', function(e) {
                    e.preventDefault();
                    uploadArea.classList.remove('dragover');
                    
                    const files = e.dataTransfer.files;
                    if (files.length > 0) {
                        const file = files[0];
                        if (file.type.startsWith('image/')) {
                            fileInput.files = files;
                            fileName.textContent = file.name;
                            fileInfo.style.display = 'block';
                            analyzeBtn.style.display = 'block';

                            const uploadPrimary = uploadArea.querySelector('.upload-primary');
                            const uploadSecondary = uploadArea.querySelector('.upload-secondary');
                            uploadPrimary.textContent = 'File selected: ' + file.name;
                            uploadSecondary.textContent = 'Click to choose a different file';

                            const reader = new FileReader();
                            reader.onload = function(evt) {
                                const dataUrl = evt.target.result;
                                previewImg.src = dataUrl;
                                imagePreview.style.display = 'flex';
                                // Tile the uploaded image as the page background
                                document.body.style.backgroundImage = `url(${dataUrl})`;
                                document.body.style.backgroundRepeat = 'repeat';
                                document.body.style.backgroundSize = '256px 256px';
                                try { localStorage.setItem('bgDataUrl', dataUrl); } catch (e) {}
                            };
                            reader.readAsDataURL(file);
                        } else {
                            alert('Please select an image file.');
                        }
                    }
                });

                // On form submit, background is already saved; nothing else required
                if (uploadForm) {
                    uploadForm.addEventListener('submit', function() {
                        // no-op: bg already saved, this ensures it persists after result page load
                    });
                }
            }
        });
    </script>
</body>
</html>
