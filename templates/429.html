{% extends "base.html" %}

{% block content %}
<h1>🍌 Banana break! 🍌</h1>
<p style="text-align: center; color: #666; margin-bottom: 30px;">
    The handstand AI needs a rest.
</p>

<div style="margin-top: 20px; padding: 24px; background-color: #fffef7; border: 2px solid #ffd700; border-radius: 12px; text-align: center;">
    <p style="font-size: 16px; color: #2c3e50; margin: 0 0 12px 0;">
        Too many uploads in a short time. Try again later — or come back tomorrow if you've used your daily uploads.
    </p>
    <p style="font-size: 13px; color: #6b7280; margin: 0;">
        Limit: {{ limit_description }}
    </p>
</div>

<div style="margin-top: 30px; text-align: center;">
    <a href="{{ url_for('index') }}" style="color: #6a3fff; font-weight: 700; text-decoration: none; font-size: 16px;">
        ← Back to home
    </a>
</div>
{% endblock %}
